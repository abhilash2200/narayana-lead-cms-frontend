<div class="rounded-xl border border-slate-200 bg-slate-50 p-4">
  <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
    <div>
      <h4 class="text-sm font-semibold text-slate-900">
        {{ label }}
      </h4>
      <p class="mt-1 text-xs text-slate-500">
        Add heading, icon and list points.
      </p>
    </div>

    <button type="button" (click)="onAddPoint()"
      class="rounded-lg bg-white px-3 py-2 text-xs font-semibold text-slate-700 border border-slate-200 transition hover:bg-slate-100">
      + Add Point
    </button>
  </div>

  <div class="mt-4">
    <div class="grid gap-3 sm:grid-cols-4">
      <div class="sm:col-span-3">
        <input type="text" [ngModel]="subHeading" (ngModelChange)="onSubHeadingChange($event)"
          [placeholder]="placeholder"
          class="w-full rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-100" />
      </div>
      <div>
        <select [ngModel]="icon" (ngModelChange)="onIconChange($event)"
          class="w-full rounded-xl border border-slate-200 bg-white px-3 py-3 text-sm text-slate-700 outline-none transition focus:border-slate-400">
          <option value="TRENDING_UP">📈 Trending Chart</option>
          <option value="PUZZLE">🧩 Puzzle</option>
          <option value="FLASK">🧪 Science Flask</option>
          <option value="ID_BADGE">🪪 ID / Teacher</option>
          <option value="STAR">⭐ Star</option>
          <option value="BOOK">📖 Book</option>
          <option value="BRAIN">🧠 Brain / Concept</option>
          <option value="SHIELD">🛡️ Shield</option>
        </select>
      </div>
    </div>

    <div class="mt-3 space-y-2">
      @for (point of listItems; track point.id) {
        <div class="flex items-center gap-2">
          <input type="text" [(ngModel)]="point.text" (ngModelChange)="onPointChange()"
            placeholder="Enter list point"
            class="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm text-slate-800 outline-none transition focus:border-slate-400 focus:ring-2 focus:ring-slate-100" />
          <button type="button" (click)="onRemovePoint(point.id)"
            class="rounded-lg border border-red-200 bg-white px-3 py-2 text-xs font-semibold text-red-600 transition hover:bg-red-50">
            Remove
          </button>
        </div>
      }
    </div>
  </div>
</div>
